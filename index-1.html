</style></head><body><div id="app"></div>

 async tlogin(){const un=v('f1').trim().toLowerCase(),em=un.includes('@')?un:un+'@team.og-shopping.app';try{await AU.signInWithEmailAndPassword(em,v('f3'));S.m=null;S.err=''}catch(e){fail('Wrong username or password.')}},

 async addt(){const n=v('f1').trim(),un=v('f2').trim().toLowerCase(),p=v('f3');if(!n||!/^[a-z0-9_.]+$/.test(un)||p.length<6)return fail('Name, username (letters/numbers) and password (6+) needed.');const sec=firebase.initializeApp(FCFG,'s'+Date.now());try{const c=await sec.auth().createUserWithEmailAndPassword(un+'@team.og-shopping.app',p);await FS.collection('roles').doc(c.user.uid).set({role:'team',name:n,un,ts:Date.now()});await sec.auth().signOut();S.err=''}catch(e){S.err=e.code==='auth/email-already-in-use'?'Username already exists.':'Failed: '+e.code}await sec.delete();render()},
 async delt(x){if(confirm('Remove this team member?'))await del('roles',x)},
 async files(x,el){S.imgs=await Promise.all([...el.files].slice(0,3).map(shrink));S._lock=0;const keep=['p1','p2','p3','p4'].map(i=>v(i));render();['p1','p2','p3','p4'].forEach((i,k)=>document.getElementById(i).value=keep[k])},
 async addp(){const l={};SH.forEach(s=>{const u=v('u_'+s[0]).trim();if(u)l[s[0]]={url:u,price:+v('pr_'+s[0])||0,rating:Math.min(5,+v('rt_'+s[0])||0)}});if(!v('p1').trim()||!S.imgs.length||!Object.keys(l).length)return fail('Name, at least 1 photo and 1 shopping link are required.');await add('products',{name:v('p1').trim(),model:v('p2').trim(),features:v('p3').trim(),cat:v('p4'),imgs:S.imgs,l,shop:0,by:S.u.name,ts:Date.now()});S.imgs=[];S.m=null;S.v='home';render()},
 async delp(x){if(confirm('Delete this product?')){await del('products',x);S.v='home';render()}},
 async rev(){const t=v('rt').trim();if(!t)return;await add('reviews',{pid:S.pid,n:+v('rn')||5,t,by:S.u.name,uid:S.u.uid,ts:Date.now()})},
 shop(x){const p=S.P.find(y=>y.id===x);if(p)upd('products',x,{shop:(p.shop||0)+1}).catch(()=>{})}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||a.tagName==='INPUT')return;const f=act[a.dataset.a];if(f)f(a.dataset.v,a)});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.a==='files')act.files(0,e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q')act.srch()});
sub('products');sub('reviews');let rs=0;
AU.onAuthStateChanged(async u=>{
 if(!u){S.u=null;render();return}
 const d=await FS.collection('roles').doc(u.uid).get();
 if(!d.exists){if(!S.pending){S.u=null;render()}return}
 const r=d.data();S.u={role:r.role,name:r.name,mobile:r.mobile,email:r.email,uid:u.uid};
 if(r.role!=='user'&&!rs){rs=1;sub('roles')}
 render()});
render();
