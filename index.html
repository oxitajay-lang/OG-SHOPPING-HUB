<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet"><title>OG Shopping Hub</title>
<style>
:root{color-scheme:dark;--bg:#0b0c10;--c1:#11131a;--c2:#171a24;--tx:#e9fbff;--mu:#8a93a8;--ac:#2f80ff;--ac2:#ff2d46;--ok:#5dffb4;--bd:#22283a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.4 Rajdhani,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:linear-gradient(rgba(47,128,255,.045) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,rgba(47,128,255,.045) 1px,transparent 1px) 0 0/30px 30px,radial-gradient(800px 380px at 85% -8%,#2a1050,transparent 60%),var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,rgba(47,128,255,.03) 0 1px,transparent 1px 3px)}
#app{max-width:1100px;margin:0 auto;padding:0 12px 96px;min-height:100vh}
button,input,select,textarea{font:inherit;color:var(--tx)}
.logo,h1,h2,h3,.btn,.tag,.pill,.cats small,.cta,.ft,.nv small{font-family:Orbitron,ui-monospace,Menlo,Consolas,monospace}
.mu{color:var(--mu)}.sm{font-size:12px}.c{text-align:center}.st{color:#ffd84d}.pr{color:var(--ok);font-weight:700}
.hd{position:sticky;top:0;z-index:20;margin:0 -12px 10px;padding:10px 12px 10px;background:rgba(3,7,13,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.logo{text-align:center;font-weight:800;font-size:19px;letter-spacing:4px;margin:2px 0 9px;background:linear-gradient(90deg,#2f80ff,#fff,#ff2d46,#2f80ff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 0 8px #ff2d4688)}
.logo.big{font-size:26px;margin-top:10px}
@keyframes shine{to{background-position:-250% 0}}
.trow{display:flex;gap:10px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:conic-gradient(#171a24,#ff2d46,#171a24);display:grid;place-items:center;font-weight:700;cursor:pointer;flex:none;border:2px solid var(--ac);box-shadow:0 0 12px #2f80ff66}
.sb{flex:1;display:flex;background:var(--c1);border:1px solid var(--bd);border-left:3px solid var(--ac);transition:.25s}
.sb:focus-within{box-shadow:0 0 14px #2f80ff77}
.sb input{flex:1;min-width:0;background:none;border:0;padding:12px;outline:0;letter-spacing:1px}
.sb button{background:var(--ac);border:0;padding:0 16px;cursor:pointer;font-size:18px;color:#02121d}
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:4px 0 14px}
.hero::-webkit-scrollbar,.row::-webkit-scrollbar,.cats::-webkit-scrollbar,.car::-webkit-scrollbar{display:none}
.bn{flex:none;width:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:space-between;padding:22px 20px;min-height:150px;background:linear-gradient(120deg,#0b0c10,#3a1670 70%,#ff2d46);border:1px solid var(--ac);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));position:relative;overflow:hidden}
.bn small{color:var(--ac);letter-spacing:1px;font-size:12px}.bn h2{margin:6px 0;font-size:24px;letter-spacing:2px}.bn p{margin:0;color:#cfeeff}
.bn i{font-style:normal;font-size:72px;filter:drop-shadow(0 0 16px #2f80ff);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.cats{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px}
.cats button{flex:none;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:70px}
.cats i{font-style:normal;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--c1);border:1px solid var(--bd);transition:.25s}
.cats small{font-size:9px;color:var(--mu);letter-spacing:.5px}
.cats .on i{border-color:var(--ac);background:linear-gradient(145deg,#2a1a5c,#0f0a24);box-shadow:0 0 16px #2f80ff88}.cats .on small{color:var(--ac)}
.sec{margin:6px 0 18px}.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;border-left:3px solid var(--ac);padding-left:8px}
.sh h2,.h2{margin:0;font-size:14px;letter-spacing:1.5px;text-transform:uppercase}.sh span{font-size:12px;color:var(--mu);text-align:right}
.row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px}
.pcard{flex:none;width:158px;scroll-snap-align:start;cursor:pointer;position:relative;background:linear-gradient(160deg,#1a1535,#0b0c10);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));transition:transform .25s,filter .25s;animation:up .5s both}
.pcard:hover{transform:translateY(-4px);filter:drop-shadow(0 6px 14px #ff2d4688)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.pimg{height:130px;overflow:hidden;position:relative;background:#0b0c10}.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.pcard:hover img{transform:scale(1.1)}
.tag{position:absolute;left:0;top:8px;background:var(--ac);color:#02121d;font-size:9px;font-weight:700;padding:3px 8px;letter-spacing:.5px}
.rk{position:absolute;right:6px;top:2px;font:800 28px Orbitron,sans-serif;color:transparent;-webkit-text-stroke:1px var(--ac);text-shadow:0 0 12px #ff2d46}
.pin{padding:9px 10px 11px}.pn{font-weight:700;line-height:1.2;height:2.4em;overflow:hidden}
.rt{display:flex;align-items:center;gap:6px;margin:6px 0 4px;font-size:13px}.pill{background:#0b4f3a;color:var(--ok);font-size:10px;padding:2px 7px;font-weight:700}
.pp{display:flex;gap:6px;align-items:baseline}.pp b{font-size:18px;color:#fff}.pp s{color:var(--mu);font-size:12px}
.empty{padding:14px;border:1px dashed var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.grid .pcard{width:auto}
.ft{margin:18px -12px 0;background:linear-gradient(90deg,#140a30,#5a22b0,#140a30);background-size:200% 100%;animation:shine 8s linear infinite;border-top:1px solid var(--ac);padding:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:1px}
.ft a{color:#fff;text-decoration:none;font-size:28px}.ft small{display:block;opacity:.85;font-family:Rajdhani,sans-serif;font-size:14px;letter-spacing:0}
.nv{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(3,7,13,.94);backdrop-filter:blur(10px);border-top:1px solid var(--ac);box-shadow:0 -6px 24px #ff2d4633}
.nv button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;font-size:19px;padding:2px}.nv small{font-size:8px;letter-spacing:.5px;color:var(--mu)}.nv i{font-style:normal}
.nv button:first-child:last-child{flex:none}
.cta{flex:3;display:block;text-align:center;text-decoration:none;color:#02121d;background:linear-gradient(90deg,var(--ac),var(--ac2));font-weight:700;font-size:13px;padding:14px;letter-spacing:1px;box-shadow:0 0 18px #ff2d4688;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.box{background:linear-gradient(145deg,rgba(14,42,62,.88),rgba(3,12,20,.92));border:1px solid var(--bd);padding:12px;margin:12px 0}
h3{font-size:12px;letter-spacing:2px;color:var(--ac);margin:12px 0 8px;text-transform:uppercase}
.btn{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#02121d;border:0;padding:11px 16px;font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.btn.g{background:var(--c2);color:var(--tx);border:0;box-shadow:inset 0 0 0 1px var(--bd)}.btn.r{background:#3a1520;color:#ff7a90}
.in{width:100%;background:var(--c2);border:1px solid var(--bd);border-left:3px solid var(--ac2);padding:10px;margin:4px 0 8px;outline:0}.in:focus{box-shadow:0 0 12px #ff2d4666}
label{font-size:12px;color:var(--mu)}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border:1px solid var(--bd);background:#0b0c10}.car img{flex:none;width:100%;height:280px;object-fit:contain;scroll-snap-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}.dots i{width:8px;height:8px;background:var(--bd)}.dots i.on{width:24px;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.pg h1{font-size:20px;margin:8px 0 2px;line-height:1.25}.tag2{color:var(--ac);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.big{font:800 28px Orbitron,sans-serif;margin:8px 0}.big s{font-size:14px;color:var(--mu);font-weight:500;margin:0 8px}.big em{font-style:normal;font-size:11px;background:var(--ac);color:#02121d;padding:3px 8px}
.ac{color:var(--ac)}.chip{display:inline-block;background:var(--c2);border:1px solid var(--bd);padding:3px 10px;font-size:13px;margin:0 6px 6px 0}
.h2{margin:18px 0 8px;color:var(--ac);padding-left:8px;border-left:3px solid var(--ac)}
.pc{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);padding:10px;margin-bottom:8px;background:var(--c1);position:relative}.pc .n{flex:1;font-weight:700}
.pc a{background:var(--ac);color:#02121d;text-decoration:none;font-weight:700;padding:9px 12px;font-size:13px}
.best{position:absolute;right:0;top:-8px;background:var(--ok);color:#02121d;font:700 8px Orbitron,sans-serif;padding:2px 6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.rv{border-top:1px solid var(--bd);padding:8px 0}
.ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--c1);border-top:2px solid var(--ac);box-shadow:0 -10px 40px #ff2d4633;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:sl .3s ease-out}@keyframes sl{from{transform:translateY(40px);opacity:0}}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button{flex:1;min-width:80px}
.err{color:#ff7a90;font-size:13px;min-height:18px}.bk{background:none;border:0;color:var(--ac);cursor:pointer;padding:12px 0;font-weight:700}
.li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--bd);padding:8px 0;font-size:14px}
.gate{max-width:440px;margin:30px auto 0}
@media(min-width:700px){.pcard{width:190px}.pimg{height:160px}.bn h2{font-size:32px}.car img{height:380px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html{background:#0b0c10}body{background:none!important}

.hd{background:rgba(11,12,16,.8)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px}.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;background:rgba(17,19,26,.85);border:1px solid var(--bd);color:var(--tx);padding:9px 16px;border-radius:30px;cursor:pointer;font:600 12px Orbitron,sans-serif;letter-spacing:.5px;transition:.25s}
.pills button:hover{border-color:var(--ac);box-shadow:0 0 12px #2f80ff55}
.pills button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#06080c;border-color:transparent;box-shadow:0 0 16px #2f80ff88,0 0 24px #ff2d4655}
.fl{display:flex;gap:10px;margin-bottom:12px}.fl label{flex:1;font:10px Orbitron,sans-serif;color:var(--mu);letter-spacing:1px}.fl select{margin:4px 0 0;border-radius:6px;font:600 13px Rajdhani,sans-serif}
.pcard{background:linear-gradient(160deg,rgba(32,22,66,.93),rgba(11,12,16,.96));will-change:transform}
.row .pcard{width:215px}
.pcard.tilt{transition:transform .08s;filter:drop-shadow(0 8px 18px #ff2d46aa)}
.chs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.chs span{font-size:11px;padding:1px 7px;border:1px solid #2f80ff55;color:var(--ac);background:#2f80ff12}
.vd{font-size:13px;line-height:1.25;color:#cfd8ee;margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.vd b{color:var(--ac2);font:700 8px Orbitron,sans-serif;display:block;letter-spacing:1px;margin-bottom:2px}
.bt,.qb{display:flex;gap:6px;margin-top:9px}.bt a,.qb a{flex:1;text-align:center;text-decoration:none;font:700 11px Orbitron,sans-serif;padding:10px 4px;letter-spacing:.5px;color:#06080c;transition:.2s}
.bt a:hover,.qb a:hover{filter:brightness(1.15);box-shadow:0 0 14px currentColor}
.bt a.amazon,.qb a.amazon{background:#ffb347}.bt a.flipkart,.qb a.flipkart{background:#4aa3ff}.qb a.meesho{background:#ff6fb1}
.qb a{font-size:12px;padding:13px 6px}
.qv{max-width:640px}.qh{display:flex;gap:12px;margin:10px 0}.qh img{width:120px;height:120px;object-fit:cover;border:1px solid var(--bd);flex:none}
table.sp{width:100%;border-collapse:collapse;font-size:15px}.sp td{padding:7px 4px;border-bottom:1px solid var(--bd);vertical-align:top}.sp td:first-child{color:var(--mu);width:34%}
.pc2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc2 ul{margin:4px 0 0;padding:0;list-style:none;font-size:15px}.pc2 li{margin-bottom:4px}.pro h3{color:var(--ok)}.con h3{color:#ff6b9d}
:root{--bg:#050506;--c1:#0b0b0e;--c2:#121217;--tx:#eceef2;--mu:#8a8d99;--ac:#2f80ff;--ac2:#ff2d46;--bd:#1e1e26}
html{background:#050506}

body::after{display:none}
.hd{background:rgba(5,5,6,.82);padding:7px 12px 8px;border-bottom:1px solid #1a1a22;margin-bottom:8px}
.logo{font-size:15px;letter-spacing:5px;margin:0 0 6px;background:linear-gradient(90deg,#9aa0ad,#fff,#2f80ff,#9aa0ad);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;filter:none}
.logo.big{font-size:22px}
.av{width:34px;height:34px;font-size:14px;box-shadow:none;border:1px solid #2f80ff99;background:#111118}
.sb{border-left:1px solid #2a2a35;border:1px solid #23232c;border-radius:20px;overflow:hidden;background:rgba(14,14,18,.9)}
.sb input{padding:7px 12px;font-size:13px;letter-spacing:.3px}
.sb button{padding:0 12px;font-size:14px;background:none;color:var(--ac)}
.sb:focus-within{box-shadow:0 0 0 1px #2f80ff66}
.bn{min-height:112px;padding:16px 18px;background:linear-gradient(120deg,#050506,#14141b 62%,#1d2a31);border:1px solid #23232c}
.bn h2{font-size:19px}.bn p{font-size:14px}.bn i{font-size:54px;filter:none}
.pills{gap:6px}.pills button{padding:7px 13px;font-size:11px;background:#0c0c10;border:1px solid #23232c;color:#b9bcc8}
.pills button.on{background:linear-gradient(90deg,#2f80ff,#ff2d46);color:#050506;box-shadow:0 0 12px #2f80ff44}
.fl label{font-size:9px}.fl select{padding:7px 8px;font-size:12px}
.sh h2{font-size:12px}.sh{border-left:2px solid var(--ac)}
.grid{grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:9px}
.pcard{background:linear-gradient(165deg,#15151b,#09090c);border:0;box-shadow:inset 0 0 0 1px #20202a;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.pcard:hover{filter:drop-shadow(0 6px 12px #2f80ff33)}
.pcard.tilt{filter:drop-shadow(0 6px 14px #2f80ff44)}
.pimg{height:92px}.row .pcard{width:150px}
.tag{font-size:8px;padding:2px 6px;background:#2f80ff}
.rk{font-size:20px;filter:none}
.pin{padding:7px 8px 9px}.pn{font-size:13px;height:2.3em;line-height:1.15}
.rt{margin:4px 0 3px;font-size:11px}.pill{font-size:9px;padding:1px 5px}
.chs{gap:3px;margin:3px 0}.chs span{font-size:10px;padding:0 5px;border-color:#2f80ff3a;background:#2f80ff0d}
.pp b{font-size:15px}.pp s{font-size:11px}
.vd{font-size:11.5px;-webkit-line-clamp:2;margin-top:4px}.vd b{font-size:7px}
.bt{gap:5px;margin-top:7px}
.bt a{padding:7px 2px;font-size:9px;background:transparent!important;border:1px solid}
.bt a.amazon{color:#f0b35a;border-color:#f0b35a66}.bt a.flipkart{color:#6db3ff;border-color:#6db3ff66}
.bt a.amazon:hover{background:#f0b35a!important;color:#050506}.bt a.flipkart:hover{background:#6db3ff!important;color:#050506}
.qh img{width:92px;height:92px}.qb a{padding:11px 6px;font-size:11px}
.md,.box{background:linear-gradient(145deg,#111116,#08080b)}
.md{border-top:1px solid #2f80ff77;box-shadow:0 -10px 40px #00000088}
.btn:not(.g):not(.r){box-shadow:none}
.ft{background:linear-gradient(90deg,#08080b,#15151c,#08080b);border-top:1px solid #23232c;animation:none}
.nv{background:rgba(5,5,6,.92);border-top:1px solid #1e1e26;box-shadow:none}
@media(min-width:700px){.pcard{width:auto}.row .pcard{width:170px}.pimg{height:120px}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
