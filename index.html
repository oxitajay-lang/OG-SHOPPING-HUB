<style>

.ac{color:var(--ac)}.chip{display:inline-block;background:var(--c2);border:1px solid var(--bd);padding:3px 10px;font-size:13px;margin:0 6px 6px 0}
.h2{margin:18px 0 8px;color:var(--ac);padding-left:8px;border-left:3px solid var(--ac)}

.rv{border-top:1px solid var(--bd);padding:8px 0}
.ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--c1);border-top:2px solid var(--ac);box-shadow:0 -10px 40px #00a8ff33;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:sl .3s ease-out}@keyframes sl{from{transform:translateY(40px);opacity:0}}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button{flex:1;min-width:80px}

.gate{max-width:440px;margin:30px auto 0}
@media(min-width:700px){.pcard{width:190px}.pimg{height:160px}.bn h2{font-size:32px}.car img{height:380px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FCFG={apiKey:"AIzaSyDXL37Ze18TT2VNeXPuSTy7DTqJEYNVTf4",authDomain:"og-shopping.firebaseapp.com",projectId:"og-shopping",storageBucket:"og-shopping.firebasestorage.app",messagingSenderId:"684820293558",appId:"1:684820293558:web:67aa8a6046a75743660317"};firebase.initializeApp(FCFG);const AU=firebase.auth(),FS=firebase.firestore();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=[['Gaming','🎮'],['Audio','🎧'],['Mobiles','📱'],['Wearables','⌚'],['Accessories','🖱️']];
const SH=[['amazon','Amazon','#ff9900'],['flipkart','Flipkart','#2874f0'],['meesho','Meesho','#e91e8c']];
const K={products:'P',reviews:'R',roles:'RL'};
const S={u:null,P:[],R:[],U:[],T:[],cat:'Gaming',v:'home',pid:null,q:'',m:null,err:'',imgs:[]};
const HERO=[['GAMING GEAR','Mouse, keyboards, headsets & GPUs','COMPARE · AMAZON · FLIPKART · MEESHO','🎮'],['4.5★ AND ABOVE','Hand-picked top rated products','REVIEWS FROM REAL USERS','⭐'],['BEST PRICE','We compare 3 stores for you','TAP SHOP NOW · SAVE MORE','💸']];
const bst=p=>{let b=null;SH.forEach(s=>{const l=p.l&&p.l[s[0]];if(l&&+l.price>0&&(!b||+l.price<+b.price))b={...l,k:s[0],n:s[1]}});return b};
const sav=p=>{const mx=maxP(p),mn=minP(p);return mx>mn&&isFinite(mn)?Math.round((1-mn/mx)*100):0};

let DBH=FS;
const LS={g(k){try{return JSON.parse(localStorage.getItem('og_'+k))||[]}catch(e){return[]}},s(k,v){try{localStorage.setItem('og_'+k,JSON.stringify(v))}catch(e){}}};
function sub(c){if(DBH)DBH.collection(c).onSnapshot(s=>{S[K[c]]=s.docs.map(d=>({id:d.id,...d.data()}));S.U=(S.RL||[]).filter(x=>x.role==='user');S.T=(S.RL||[]).filter(x=>x.role==='team');render()},()=>{});else{S[K[c]]=LS.g(c)}}
async function add(c,o){if(DBH){await DBH.collection(c).add(o)}else{o.id='l'+Date.now()+Math.random().toString(36).slice(2,5);const a=LS.g(c);a.push(o);LS.s(c,a);S[K[c]]=a;render()}}
async function upd(c,id,o){if(DBH){await DBH.collection(c).doc(id).update(o)}else{const a=LS.g(c),i=a.findIndex(x=>x.id==id);if(i>=0)Object.assign(a[i],o);LS.s(c,a);S[K[c]]=a;render()}}
async function del(c,id){if(DBH){await DBH.collection(c).doc(id).delete()}else{const a=LS.g(c).filter(x=>x.id!=id);LS.s(c,a);S[K[c]]=a;render()}}
async function hsh(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const prices=p=>SH.map(s=>+(p.l&&p.l[s[0]]&&p.l[s[0]].price)||0).filter(x=>x>0);
const minP=p=>Math.min(...prices(p),Infinity),maxP=p=>Math.max(...prices(p),0);
const rats=p=>SH.map(s=>+(p.l&&p.l[s[0]]&&p.l[s[0]].rating)||0).filter(x=>x>0);
const avgR=p=>{const r=rats(p);return r.length?r.reduce((a,b)=>a+b,0)/r.length:0};
const inr=n=>isFinite(n)&&n>0?'₹'+Number(n).toLocaleString('en-IN'):'—';
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
const isTeam=()=>S.u&&(S.u.role==='team'||S.u.role==='admin');
function card(p){return`<div class="card" data-a="open" data-v="${p.id}"><img src="${esc((p.imgs||[])[0])}" alt=""><div><b>${esc(p.name)}</b><span class="st">★ ${avgR(p).toFixed(1)}</span> <span class="pr">${inr(minP(p))}</span></div></div>`}
function sect(t,sp,arr){return`<div class="sec"><h3>${t} <span>${sp}</span></h3>${arr.length?`<div class="row">${arr.slice(0,6).map(card).join('')}</div>`:'<div class="mu">No products yet.</div>'}</div>`}
function home(){
 if(S.q){const q=S.q.toLowerCase(),r=S.P.filter(p=>[p.name,p.model,p.features,p.cat].join(' ').toLowerCase().includes(q));return`<h3 style="margin-top:14px">Results for “${esc(S.q)}”</h3>${r.length?`<div class="grid">${r.map(card).join('')}</div>`:'<div class="mu">Nothing found.</div>'}`}
 const top=[...S.P].sort((a,b)=>(b.shop||0)-(a.shop||0)||(b.ts||0)-(a.ts||0)).slice(0,5);
 const it=S.P.filter(p=>p.cat===S.cat);
 const best=it.filter(p=>avgR(p)>=4.5).sort((a,b)=>avgR(b)-avgR(a)),bud=[...it].sort((a,b)=>minP(a)-minP(b)),ex=[...it].sort((a,b)=>maxP(b)-maxP(a));
 return`<div class="box"><h3>Top 5 most buying products</h3>${top.length?`<div class="row">${top.map(card).join('')}</div>`:'<div class="mu">Team will add products soon.</div>'}</div>
 <div class="main2"><div class="cats">${CATS.map(c=>`<button class="${c[0]===S.cat?'on':''}" data-a="cat" data-v="${c[0]}" title="${c[0]}"><span>${c[1]}</span><small>${c[0]}</small></button>`).join('')}</div>
 <div class="cont">${sect('Best product','4.5★ and above',best)}${sect('Budget friendly','lowest price',bud)}${sect('Expensive','premium',ex)}</div></div>
 <div class="ft"><div>FOLLOW OFFICIAL INSTAGRAM<small>@og_shoppinghub</small></div><a href="https://www.instagram.com/og_shoppinghub" target="_blank" rel="noopener" style="font-size:26px">📸</a></div>`}
function prod(){
 const p=S.P.find(x=>x.id===S.pid);if(!p)return'<button class="bk" data-a="home">← Back</button><div class="mu">Product not found.</div>';
 const rv=S.R.filter(r=>r.pid===p.id).sort((a,b)=>b.ts-a.ts),ra=rv.length?rv.reduce((a,r)=>a+r.n,0)/rv.length:0;
 const oth=S.P.filter(x=>x.id!==p.id).slice(0,8);
 return`<button class="bk" data-a="home">← Back</button>
 <div class="car" id="car">${(p.imgs||[]).map(i=>`<img src="${esc(i)}" alt="">`).join('')}</div><div class="dots" id="dots">${(p.imgs||[]).map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>
 <h3>Product info</h3><div class="box" style="margin-top:0"><b>Name:</b> ${esc(p.name)}<br><b>Model:</b> ${esc(p.model)}<br><b>Features:</b> ${esc(p.features)}<br><b>Category:</b> ${esc(p.cat)}</div>
 <h3>Price comparison</h3>${SH.filter(s=>p.l&&p.l[s[0]]&&p.l[s[0]].url).map(s=>{const l=p.l[s[0]];return`<div class="pc"><span class="dot" style="background:${s[2]}"></span><div class="n">${s[1]}<div class="st" style="font-size:12px">${l.rating?stars(l.rating)+' '+l.rating:''}</div></div><div class="pr">${inr(l.price)}</div><a href="${esc(l.url)}" target="_blank" rel="noopener" data-a="shop" data-v="${p.id}">Shop Now</a></div>`}).join('')}
 <h3>Product reviews</h3><div class="box" style="margin-top:0"><div style="display:flex;justify-content:space-between"><b>Recent reviews</b><span class="st">★ ${rv.length?ra.toFixed(1):'—'} (${rv.length})</span></div>
 ${rv.slice(0,8).map(r=>`<div class="rv"><span class="st">${stars(r.n)}</span> <b>${esc(r.by)}</b><br>${esc(r.t)}</div>`).join('')||'<div class="mu">No reviews yet. Only signed-up users can review.</div>'}
 ${S.u&&S.u.role==='user'?`<div style="margin-top:8px"><select class="in" id="rn"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><textarea class="in" id="rt" rows="2" placeholder="Write your honest review"></textarea><button class="btn" data-a="rev">Post review</button></div>`:S.u?'':'<div class="mu" style="margin-top:6px">Sign up / log in to write a review.</div>'}</div>
 ${isTeam()?`<button class="btn r" data-a="delp" data-v="${p.id}">Delete this product</button>`:''}
 <h3 style="margin-top:14px">More product suggestions</h3><div class="row">${oth.map(card).join('')}</div><div style="height:20px"></div>`}
function modal(g){
 const m=S.m||(g?'login':null);if(!m)return'';let h='';const u=S.u;
 const tabs=(a)=>`<div class="tabs">${a.map(x=>`<button class="btn ${x[0]===m?'':'g'}" data-a="m" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
